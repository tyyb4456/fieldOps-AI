[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "chromadb>=1.5.9",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langchain[google-genai]>=1.4.7",
    "langgraph>=1.2.19",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.2.4",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
